services:
  redis:
    image: redis:7-alpine
    container_name: study-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  maildev:
    image: maildev/maildev:2.1.0
    container_name: study-maildev
    ports:
      - "1080:1080" # Interface Web (onde você vai ver os e-mails chegando)
      - "1025:1025" # Porta SMTP interna que o NestJS usa para empurrar o e-mail

volumes:
  redis_data: